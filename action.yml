name: 'MadX Leakguard'
description: 'Fail CI when a commit leaks a LAN machine identity, internal hostname, private IP, home path, or secret into a public repo.'
branding:
  icon: 'shield'
  color: 'orange'
runs:
  using: composite
  steps:
    - name: leakguard scan
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}   # via env, not inline, to avoid script injection
      run: python3 "$GITHUB_ACTION_PATH/leakguard.py" ci --base "$BASE_REF"
